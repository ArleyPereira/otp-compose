buildscript {
    dependencies {
        // AGP 9 ships built-in Kotlin backed by its own KGP version. Declaring it
        // here keeps the Kotlin compiler aligned with the `kotlin` version in the
        // version catalog, which the Compose compiler plugin has to match.
        classpath libs.kotlin.gradle.plugin
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.google.services) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.ktlint)
}

allprojects {
    apply plugin: "org.jlleitschuh.gradle.ktlint"
    apply plugin: "maven-publish"
}
